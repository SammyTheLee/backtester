# MA crossover only when rolling volatility is high enough.
#
#   python -m bt run --config configs/vol_gated.toml
#
# rolling_vol = std of hourly returns over vol_window bars.
# Signals fire only when rolling_vol >= vol_min.

[data]
csv_path = "data/candles/DEMO.csv"

[strategy]
type = "vol_gated_ma"
fast = 5
slow = 20
vol_window = 14
vol_min = 0.003

[execution]
stop_pct = 0.02
target_pct = 0.04
fee_bps = 10
slippage_bps = 5

[portfolio]
initial_equity = 10000.0
size = 1.0

[output]
summary_sort_by = "composite_score"
drawdown_penalty = 1.0
summary_top_n = 10
