# MA crossover only when a regime column in the CSV is active.
#
#   python -m bt run --config configs/regime_gated.toml
#
# Your candle CSV must include the regime column (default: risk_on).
# Truthy values: 1, true, yes, on, risk_on

[data]
csv_path = "data/candles/DEMO_regime.csv"

[strategy]
type = "regime_gated_ma"
fast = 5
slow = 20
regime_column = "risk_on"

[execution]
stop_pct = 0.02
target_pct = 0.04
fee_bps = 10
slippage_bps = 5

[portfolio]
initial_equity = 10000.0
size = 1.0

[output]
summary_sort_by = "composite_score"
drawdown_penalty = 1.0
summary_top_n = 10
