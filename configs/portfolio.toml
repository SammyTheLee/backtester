# Multi-asset portfolio backtest — one shared cash balance, exposure limits.
#
#   python -m bt portfolio --config configs/portfolio.toml
#   python -m bt run --config configs/portfolio.toml   # same when multiple assets

[data]
assets = [
  { symbol = "BTC", csv_path = "data/candles/BTC_USD.csv" },
  { symbol = "DEMO", csv_path = "data/candles/DEMO.csv" },
]

[strategy]
type = "ma_crossover"
fast = 5
slow = 20

[execution]
stop_pct = 0.02
target_pct = 0.04
fee_bps = 10
slippage_bps = 5

[portfolio]
mode = "portfolio"
initial_equity = 10000.0
size = 1.0
max_open_positions = 2
max_total_exposure_pct = 0.6
max_exposure_per_asset_pct = 0.4

[output]
summary_sort_by = "composite_score"
drawdown_penalty = 1.0
summary_top_n = 10
