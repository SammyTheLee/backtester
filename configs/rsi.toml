# RSI mean-reversion strategy on DEMO candles.
#
#   python -m bt run --config configs/rsi.toml

[data]
csv_path = "data/candles/DEMO.csv"

[strategy]
type = "rsi"
period = 14
oversold = 30
overbought = 70

[execution]
stop_pct = 0.02
target_pct = 0.04
fee_bps = 10
slippage_bps = 5

[portfolio]
initial_equity = 10000.0
size = 1.0

[output]
summary_sort_by = "composite_score"
drawdown_penalty = 1.0
summary_top_n = 10
